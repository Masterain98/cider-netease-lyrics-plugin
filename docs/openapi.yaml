openapi: 3.1.0
info:
  title: Cider NetEase Lyrics Gateway
  version: 0.2.0
  description: Minimal anonymous search and line-lyric gateway. No login, playback URL, account, Cookie, or unblock routes exist.
  summary: Send Cache-Control no-cache on v1 requests to bypass the short-lived upstream result cache.
servers:
  - url: http://127.0.0.1:3100
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive. Does not contact NetEase.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, schemaVersion]
                properties:
                  status: { const: ok }
                  service: { const: cider-netease-lyrics-gateway }
                  schemaVersion: { const: 1 }
  /v1/resolve:
    post:
      operationId: resolveTrack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackQuery" }
      responses:
        "200":
          description: Resolution outcome, including manual/no-match states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/search:
    post:
      operationId: searchTracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [track]
              properties:
                track: { $ref: "#/components/schemas/TrackQuery" }
                query: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: Ranked, deduplicated candidates.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, queries, candidates]
                properties:
                  schemaVersion: { const: 1 }
                  queries: { type: array, items: { type: string } }
                  candidates: { type: array, items: { $ref: "#/components/schemas/TrackCandidate" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/Timeout" }
  /v1/lyrics/{neteaseId}:
    get:
      operationId: getLyrics
      parameters:
        - name: neteaseId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{1,20}$" }
        - name: durationMs
          in: query
          required: false
          schema: { type: number, exclusiveMinimum: 0 }
      responses:
        "200":
          description: Parsed provider-compatible line lyrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LyricsResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: Song has no usable line lyrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/Timeout" }
components:
  responses:
    InvalidRequest:
      description: Invalid JSON, schema, ID, or oversized request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Per-IP or per-song limit exceeded.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamError:
      description: NetEase is unavailable or rejected the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Timeout:
      description: Total or upstream deadline elapsed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    TrackQuery:
      type: object
      additionalProperties: false
      required: [title, artist, album]
      properties:
        appleMusicId: { type: string, minLength: 1, maxLength: 256 }
        title: { type: string, minLength: 1, maxLength: 512 }
        artist: { type: string, minLength: 1, maxLength: 512 }
        album: { type: string, maxLength: 512 }
        durationMs: { type: number, exclusiveMinimum: 0, maximum: 86400000 }
        isrc: { type: string, pattern: "^[A-Za-z]{2}-?[A-Za-z0-9]{3}-?[0-9]{2}-?[0-9]{5}$" }
    ScoreBreakdown:
      type: object
      required: [title, artist, album, duration, versionPenalty]
      properties:
        title: { type: number, minimum: 0, maximum: 0.45 }
        artist: { type: number, minimum: 0, maximum: 0.2 }
        album: { type: number, minimum: 0, maximum: 0.25 }
        duration: { type: number, minimum: 0, maximum: 0.1 }
        versionPenalty: { type: number, minimum: 0, maximum: 0.5 }
    TrackCandidate:
      type: object
      required: [neteaseId, title, artists, album, score, scoreBreakdown, versionTags, severeVersionConflict]
      properties:
        neteaseId: { type: string, pattern: "^[0-9]{1,20}$" }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        durationMs: { type: number }
        aliases: { type: array, items: { type: string } }
        score: { type: number, minimum: 0, maximum: 1 }
        scoreBreakdown: { $ref: "#/components/schemas/ScoreBreakdown" }
        versionTags:
          type: array
          items:
            enum: [live, remaster, acoustic, instrumental, demo, radio-edit, karaoke, mono, stereo, deluxe, expanded]
        severeVersionConflict: { type: boolean }
    LyricLine:
      type: object
      required: [start, end, text, words, empty]
      properties:
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
        text: { type: string }
        translation: { type: string }
        words: { type: array, items: { $ref: "#/components/schemas/LyricLine" } }
        empty: { type: boolean }
        isDuet: { type: boolean }
        index: { type: integer, minimum: 0 }
        isCredit: { type: boolean }
    LyricResult:
      type: object
      required: [type, lyrics, source, neteaseId]
      properties:
        type: { enum: [Line, Word, None] }
        lyrics: { type: array, items: { $ref: "#/components/schemas/LyricLine" } }
        source: { const: NetEase }
        neteaseId: { type: string }
    LyricDiagnostics:
      type: object
      required: [fields, unmatchedTranslations, translationCjkRatio, translationIsChinese, parsedRomanizationLines]
      properties:
        fields:
          type: object
          required: [lrc, tlyric, romalrc, yrc]
          properties:
            lrc: { type: boolean }
            tlyric: { type: boolean }
            romalrc: { type: boolean }
            yrc: { type: boolean }
        unmatchedTranslations:
          type: array
          items:
            type: object
            required: [start, text]
            properties:
              start: { type: number }
              text: { type: string }
        translationCjkRatio: { type: number, minimum: 0, maximum: 1 }
        translationIsChinese: { type: boolean }
        parsedRomanizationLines: { type: integer, minimum: 0 }
    LyricsResponse:
      type: object
      required: [schemaVersion, lyrics, diagnostics]
      properties:
        schemaVersion: { const: 1 }
        lyrics: { $ref: "#/components/schemas/LyricResult" }
        diagnostics: { $ref: "#/components/schemas/LyricDiagnostics" }
    ResolveResponse:
      type: object
      required: [schemaVersion, state, queries, candidates, reason]
      properties:
        schemaVersion: { const: 1 }
        state: { enum: [ready, selecting-candidate, no-match, no-lyrics] }
        queries: { type: array, items: { type: string } }
        match: { $ref: "#/components/schemas/TrackCandidate" }
        candidates: { type: array, items: { $ref: "#/components/schemas/TrackCandidate" } }
        lyrics: { $ref: "#/components/schemas/LyricResult" }
        lyricDiagnostics: { $ref: "#/components/schemas/LyricDiagnostics" }
        reason: { type: string }
    ErrorResponse:
      type: object
      required: [schemaVersion, error]
      properties:
        schemaVersion: { const: 1 }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              enum: [INVALID_REQUEST, NO_MATCH, NO_LYRICS, TIMEOUT, RATE_LIMITED, UPSTREAM_UNAVAILABLE, SERVICE_ERROR]
            message: { type: string }
            requestId: { type: string }
            retryAfterSeconds: { type: integer, minimum: 1 }
